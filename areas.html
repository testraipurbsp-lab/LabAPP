<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Management · Vitals Lab</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div class="main-area">
    <div id="topbar-host"></div>
    <div class="page-content">
      <div class="flex-between mb-16" style="flex-wrap:wrap;gap:10px;">
        <div><h2 style="font-family:var(--font-display);font-size:18px;">Area Management</h2><p class="text-muted" style="font-size:12.5px;">Collection zones and pickup charges</p></div>
        <div class="page-actions"><button class="btn btn-primary" id="add-area-btn"><span data-icon="plus"></span> Add Area</button></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="search-box"><span data-icon="search"></span><input type="text" id="search-input" placeholder="Search area or city…"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Area Name</th><th>City</th><th>Pincode</th><th>Collection Charge</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="areas-table-body"></tbody>
          </table>
        </div>
        <div class="pagination" id="areas-pagination"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="area-modal">
  <div class="modal-box modal-sm">
    <div class="modal-head"><h3 id="area-modal-title">Add Area</h3><button class="modal-close" onclick="VLAB.closeModal('area-modal')"><span data-icon="x"></span></button></div>
    <div class="modal-body">
      <form id="area-form">
        <input type="hidden" id="a-id">
        <div class="field-group"><label>Area Name *</label><input type="text" id="a-name" required></div>
        <div class="field-group"><label>City</label><input type="text" id="a-city"></div>
        <div class="field-group"><label>Pincode</label><input type="text" id="a-pincode"></div>
        <div class="field-group"><label>Collection Charge (₹)</label><input type="number" id="a-charge" min="0"></div>
        <div class="field-group"><label>Status</label><select id="a-status"><option>Active</option><option>Inactive</option></select></div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="VLAB.closeModal('area-modal')">Cancel</button>
      <button class="btn btn-primary" id="area-save-btn"><span data-icon="save"></span> Save</button>
    </div>
  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/areas.js"></script>
</body>
</html>
