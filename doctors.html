<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctors · Vitals Lab</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<div class="app-shell">
  <div class="main-area">
    <div id="topbar-host"></div>
    <div class="page-content">
      <div class="flex-between mb-16" style="flex-wrap:wrap;gap:10px;">
        <div><h2 style="font-family:var(--font-display);font-size:18px;">Referring Doctors</h2><p class="text-muted" style="font-size:12.5px;">Manage doctor network & commissions</p></div>
        <div class="page-actions"><button class="btn btn-primary" id="add-doctor-btn"><span data-icon="plus"></span> Add Doctor</button></div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="search-box"><span data-icon="search"></span><input type="text" id="search-input" placeholder="Search doctor, hospital, specialization…"></div>
          <select id="filter-status"><option value="">All Status</option><option>Active</option><option>Inactive</option></select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Doctor</th><th>Specialization</th><th>Hospital / Clinic</th><th>Phone</th><th>Commission</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="doctors-table-body"></tbody>
          </table>
        </div>
        <div class="pagination" id="doctors-pagination"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="doctor-modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="doctor-modal-title">Add Doctor</h3><button class="modal-close" onclick="VLAB.closeModal('doctor-modal')"><span data-icon="x"></span></button></div>
    <div class="modal-body">
      <form id="doctor-form">
        <input type="hidden" id="d-id">
        <div class="form-grid">
          <div class="field-group span-2"><label>Doctor Name *</label><input type="text" id="d-name" required></div>
          <div class="field-group"><label>Specialization</label><input type="text" id="d-spec"></div>
          <div class="field-group"><label>Hospital</label><input type="text" id="d-hospital"></div>
          <div class="field-group"><label>Clinic</label><input type="text" id="d-clinic"></div>
          <div class="field-group"><label>Phone *</label><input type="tel" id="d-phone" required></div>
          <div class="field-group"><label>Email</label><input type="email" id="d-email"></div>
          <div class="field-group span-2"><label>Address</label><input type="text" id="d-address"></div>
          <div class="field-group"><label>Commission %</label><input type="number" id="d-commission" min="0" max="100"></div>
          <div class="field-group"><label>Status</label><select id="d-status"><option>Active</option><option>Inactive</option></select></div>
          <div class="field-group span-3"><label>Notes</label><textarea id="d-notes" rows="2"></textarea></div>
        </div>
      </form>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="VLAB.closeModal('doctor-modal')">Cancel</button>
      <button class="btn btn-primary" id="doctor-save-btn"><span data-icon="save"></span> Save Doctor</button>
    </div>
  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/doctors.js"></script>
</body>
</html>
